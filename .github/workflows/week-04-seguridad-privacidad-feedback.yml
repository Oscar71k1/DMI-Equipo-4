# Current regression checks and official validation of the frozen delivery are distinct.
name: Week 04 Academic Feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week-04-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-tests:
    name: Current commit - Week 04 tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Use Node.js 22.22.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Reproducible setup
        run: make setup
      - name: Verify current toolchain
        run: make verify-week-04
      - name: Run team and public tests on current commit
        shell: bash
        run: |
          mkdir -p reports/week-04/logs
          npm test -- --ci --runInBand --runTestsByPath tests/secure-storage.test.ts tests/telemetry.test.ts tests/session-integration.test.tsx course-tests/public/week-04.test.ts 2>&1 | tee reports/week-04/logs/ci-current-tests.txt
      - name: Upload current commit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week-04-current-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: reports/week-04/**

  frozen-delivery:
    name: Official evaluation - week-04-final
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout frozen delivery
        uses: actions/checkout@v4
        with:
          ref: refs/tags/week-04-final
          fetch-depth: 2
      - name: Verify final tag identity
        shell: bash
        run: |
          git fetch --no-tags --depth=2 origin refs/tags/week-04-final:refs/tags/week-04-final
          test "$(git rev-list -n 1 refs/tags/week-04-final)" = "$(git rev-parse HEAD)"
          echo "Evaluated delivery: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Use Node.js 22.22.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Reproducible setup
        run: make setup
      - name: Baseline feedback and Android export
        run: make feedback
      - name: Official reproducibility
        run: make verify-week-04
      - name: Official public behavior and evidence schemas
        run: make public-test-week-04
      - name: Official frozen evidence validation
        run: make evidence-week-04
      - name: Upload frozen delivery results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week-04-frozen-delivery
          if-no-files-found: warn
          path: |
            reports/week-04/**
            evidence/week-04/**
