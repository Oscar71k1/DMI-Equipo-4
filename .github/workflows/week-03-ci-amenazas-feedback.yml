# Current regression checks and official validation of the frozen delivery are distinct.
name: Week 03 Academic Feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week-03-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-tests:
    name: Current commit - Week 03 tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current commit
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Use Node.js 22.22.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Reproducible setup
        id: setup
        run: make setup
      - name: Public Expo Android build
        id: build
        run: npm run bundle:release
      - name: Verify current toolchain
        id: verify
        run: make verify-week-03
      - name: Run team and public tests on current commit
        id: regressions
        shell: bash
        run: |
          mkdir -p reports/week-03/logs
          npm test -- --ci --runInBand --runTestsByPath tests/architecture.test.ts tests/incidents.test.tsx tests/security.test.ts course-tests/public/week-03.test.ts 2>&1 | tee reports/week-03/logs/ci-current-tests.txt
      - name: Secret scanner positive and negative controls
        id: scanner
        shell: bash
        run: |
          mkdir -p reports/week-03/logs
          python3 tests/secret_scanner_test.py 2>&1 | tee reports/week-03/logs/ci-secret-scanner.txt
      - name: Record CI execution
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_EVALUATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          steps = json.loads(os.environ['CI_STEP_RESULTS'])
          report = {
              'schemaVersion': 1,
              'week': 3,
              'commitSha': os.environ['CI_EVALUATED_SHA'],
              'generatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'jobStatusBeforeUpload': os.environ['CI_JOB_STATUS'],
              'event': os.environ['GITHUB_EVENT_NAME'],
              'ref': os.environ['GITHUB_REF'],
              'runUrl': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'steps': {name: {'outcome': value['outcome'], 'conclusion': value['conclusion']} for name, value in steps.items()},
          }
          target = Path('reports/week-03/ci-execution.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Upload current commit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week-03-current-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: reports/week-03/**

  frozen-delivery:
    name: Official evaluation - week-03-final
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout frozen delivery
        uses: actions/checkout@v4
        with:
          ref: refs/tags/week-03-final
          fetch-depth: 2
      - name: Verify final tag identity
        shell: bash
        run: |
          git fetch --no-tags --depth=2 origin refs/tags/week-03-final:refs/tags/week-03-final
          test "$(git rev-list -n 1 refs/tags/week-03-final)" = "$(git rev-parse HEAD)"
          echo "Evaluated delivery: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Use Node.js 22.22.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Reproducible setup
        id: setup
        run: make setup
      - name: Baseline feedback and Android export
        run: make feedback
      - name: Official reproducibility
        run: make verify-week-03
      - name: Frozen architecture and security regressions
        run: npm test -- --ci --runInBand --runTestsByPath tests/architecture.test.ts tests/incidents.test.tsx tests/security.test.ts
      - name: Secret scanner positive and negative controls
        id: scanner
        shell: bash
        run: |
          mkdir -p reports/week-03/logs
          python3 tests/secret_scanner_test.py 2>&1 | tee reports/week-03/logs/ci-secret-scanner.txt
      - name: Official public behavior and evidence schemas
        run: make public-test-week-03
      - name: Official frozen evidence validation
        run: make evidence-week-03
      - name: Upload frozen delivery results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week-03-frozen-delivery
          if-no-files-found: warn
          path: |
            reports/week-03/**
            evidence/week-03/**
