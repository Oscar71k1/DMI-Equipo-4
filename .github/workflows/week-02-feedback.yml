# Current regression checks and official validation of the frozen delivery are distinct.
name: Week 02 Academic Feedback

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week-02-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-tests:
    name: Current commit - Week 02 tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Use Node.js 22.22.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Reproducible setup
        run: make setup
      - name: Verify current toolchain
        run: make verify-week-02
      - name: Run team and public tests on current commit
        shell: bash
        run: |
          mkdir -p reports/week-02/logs
          npm test -- --ci --runInBand --runTestsByPath tests/architecture.test.ts tests/incidents.test.tsx course-tests/public/week-02.test.ts 2>&1 | tee reports/week-02/logs/ci-current-tests.txt
      - name: Upload current commit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week-02-current-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: reports/week-02/**
