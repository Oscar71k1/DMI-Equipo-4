# Week 06 current-commit checks for session lifecycle and concurrency.
name: Week 06 Secure Session Feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week-06-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-tests:
    name: Current commit - Week 06 session tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Use Node.js 22.22.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Reproducible setup
        run: make setup
      - name: Verify current toolchain
        run: make verify-week-06
      - name: Run session, authorization and public Week 06 tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/week-06/logs
          npm test -- --ci --runInBand --runTestsByPath tests/session-refresh.test.ts course-tests/public/week-06.test.ts 2>&1 | tee reports/week-06/logs/ci-current-tests.txt
      - name: Upload current commit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week-06-current-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: |
            reports/week-06/**
            evidence/week-06/**

  frozen-delivery:
    if: startsWith(github.ref, 'refs/tags/week-06-final')
    name: Official evaluation - week-06-final
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout frozen delivery
        uses: actions/checkout@v4
        with:
          ref: refs/tags/week-06-final
          fetch-depth: 2
      - name: Verify final tag identity
        shell: bash
        run: |
          git fetch --no-tags --depth=2 origin refs/tags/week-06-final:refs/tags/week-06-final
          test "$(git rev-list -n 1 refs/tags/week-06-final)" = "$(git rev-parse HEAD)"
          echo "Evaluated delivery: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Use Node.js 22.22.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Reproducible setup
        run: make setup
      - name: Baseline feedback and Android export
        run: make feedback
      - name: Official reproducibility
        run: make verify-week-06
      - name: Official public behavior and evidence schemas
        run: make public-test-week-06
      - name: Official frozen evidence validation
        run: make evidence-week-06
      - name: Upload frozen delivery results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week-06-frozen-delivery
          if-no-files-found: warn
          path: |
            reports/week-06/**
            evidence/week-06/**
